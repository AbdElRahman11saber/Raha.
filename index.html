<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>RAHA | A Mark of Distinction</title>
  <style>
    :root {
      --bg: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #1A1A1A;
      --text-muted: #7A756D;
      --gold: #C5A880;
      --gold-dark: #A3845B;
      --border: #EADBCC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .splash-logo {
      font-size: 2.4rem;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--text-main);
      animation: splashAppear 1.2s forwards ease-out;
    }

    .splash-star {
      color: var(--gold);
      font-size: 1rem;
      margin: 6px 0;
    }

    .splash-sub {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--gold-dark);
      text-transform: uppercase;
    }

    @keyframes splashAppear {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: rgba(250, 248, 245, 0.95);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text-main);
    }

    .brand-tagline {
      font-size: 0.55rem;
      letter-spacing: 1.5px;
      color: var(--gold-dark);
      text-transform: uppercase;
    }

    .cart-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filters-wrapper {
      padding: 14px 16px 8px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters-wrapper::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .container {
      padding: 12px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card-thumb {
      width: 100%;
      height: 160px;
      background: #ECE6DD;
      position: relative;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: auto;
    }

    .card-price {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 26, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: flex-end;
    }

    .drawer-overlay.active { display: flex; }

    .drawer-sheet {
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .close-icon {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .options-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 12px 0 6px;
      font-weight: 600;
    }

    .options-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .size-box, .color-chip {
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg);
    }

    .size-box.selected, .color-chip.selected {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .bundle-section {
      background: #FAF6F0;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .bundle-header {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--gold-dark);
      margin-bottom: 6px;
    }

    .primary-btn {
      width: 100%;
      background: var(--text-main);
      color: var(--bg);
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 16px;
      cursor: pointer;
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .text-input {
      width: 100%;
      padding: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 8px;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-logo">RAHA</div>
    <div class="splash-star">✦</div>
    <div class="splash-sub">A Mark of Distinction</div>
  </div>

  <header>
    <div>
      <div class="brand-title">RAHA</div>
      <div class="brand-tagline">A Mark of Distinction</div>
    </div>
    <button class="cart-btn" onclick="openCart()">
      السلة (<span id="cart-count">0</span>)
    </button>
  </header>

  <div class="filters-wrapper">
    <button class="filter-btn active" onclick="applyFilter('all', this)">جميع المنتجات</button>
    <button class="filter-btn" onclick="applyFilter('deals', this)">العروض</button>
    <button class="filter-btn" onclick="applyFilter('أحذية وسليبرات', this)">أحذية وسليبرات</button>
    <button class="filter-btn" onclick="applyFilter('ملابس', this)">ملابس</button>
    <button class="filter-btn" onclick="applyFilter('إكسسوارات', this)">إكسسوارات</button>
  </div>

  <main class="container">
    <div class="catalog-grid" id="catalog-container"></div>
  </main>

  <!-- Product & Deal Drawer -->
  <div class="drawer-overlay" id="product-drawer">
    <div class="drawer-sheet">
      <div class="sheet-header">
        <h3 id="p-title"></h3>
        <button class="close-icon" onclick="closeDrawer('product-drawer')">&times;</button>
      </div>

      <img id="p-image" src="" style="width: 100%; height: 210px; object-fit: cover; border-radius: 8px;">
      <p id="p-desc" style="color: var(--text-muted); font-size: 0.85rem; margin: 12px 0; line-height: 1.4;"></p>
      
      <div class="price-row" style="margin-bottom: 10px;">
        <span id="p-price" style="font-size: 1.2rem; font-weight: 700;"></span>
      </div>

      <!-- Single Product Controls -->
      <div id="single-controls">
        <div class="options-title">المقاس:</div>
        <div class="options-row" id="p-sizes"></div>
        <div class="options-title">اللون:</div>
        <div class="options-row" id="p-colors"></div>
      </div>

      <!-- Deal 3 Bundle Controls -->
      <div id="bundle-controls" style="display: none;">
        <!-- Item 1: المنقرش -->
        <div class="bundle-section">
          <div class="bundle-header">1. السليبر المنقرش</div>
          <div class="options-title">المقاس:</div>
          <div class="options-row" id="b1-sizes"></div>
          <div class="options-title">اللون:</div>
          <div class="options-row" id="b1-colors"></div>
        </div>

        <!-- Item 2: التايجر -->
        <div class="bundle-section">
          <div class="bundle-header">2. السليبر التايجر</div>
          <div class="options-title">المقاس:</div>
          <div class="options-row" id="b2-sizes"></div>
          <div class="options-title">اللون:</div>
          <div class="options-row" id="b2-colors"></div>
        </div>

        <!-- Item 3: المجدول -->
        <div class="bundle-section">
          <div class="bundle-header">3. السليبر المجدول</div>
          <div class="options-title">المقاس:</div>
          <div class="options-row" id="b3-sizes"></div>
          <div class="options-title">اللون:</div>
          <div class="options-row" id="b3-colors"></div>
        </div>
      </div>

      <button class="primary-btn" onclick="addToCartConfirm()">إضافة إلى السلة</button>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="cart-drawer">
    <div class="drawer-sheet">
      <div class="sheet-header">
        <h3>سلة الطلبات</h3>
        <button class="close-icon" onclick="closeDrawer('cart-drawer')">&times;</button>
      </div>
      <div id="cart-list"></div>
      <div style="display:flex; justify-content:space-between; margin-top:14px; font-weight:700;">
        <span>الإجمالي:</span>
        <span id="cart-total-val">0 ج.م</span>
      </div>

      <form onsubmit="handleOrderSubmit(event)" style="margin-top: 18px;">
        <input type="text" id="cust-name" class="text-input" placeholder="الاسم بالكامل" required>
        <input type="tel" id="cust-phone" class="text-input" placeholder="رقم الهاتف (واتساب)" required>
        <textarea id="cust-address" class="text-input" rows="2" placeholder="العنوان بالتفصيل والمحافظة" required></textarea>
        <button type="submit" id="submit-btn" class="primary-btn" style="background: var(--gold-dark);">إتمام الطلب عبر واتساب</button>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDIc69z2S_KD2C2N_ZQGMfzPokdTGChvABDI7ymkQPo3zGJT5k1HICGflMy_vmWeJF9g/exec";
    const waNumber = "201203541255"; // استبدل برقم هاتفك المسجل

    const baseProducts = [
      { id: "RAHA-01", title: "سليبر واطي مخطط", category: "أحذية وسليبرات", price: 145, onSale: false, desc: "تصميم أنيق ونعل مريح", img: "https://lh3.googleusercontent.com/d/1bf6x_5OZAU8T7fpvXqzumExtla6t13gi", sizes: [37, 38, 39, 40, 41], colors: ["أسود مذهب"] },
      { id: "RAHA-02", title: "سليبر واطي منقرش", category: "أحذية وسليبرات", price: 145, onSale: false, desc: "خامة قماشية بنقوش هندسية", img: "https://lh3.googleusercontent.com/d/1_ZrlwKsSg-PCKNuCqMA_dtQsKL9ATxhv", sizes: [37, 38, 39, 40, 41], colors: ["اسود", "بيج", "هافان"] },
      { id: "RAHA-03", title: "الماظ", category: "أحذية وسليبرات", price: 175, onSale: false, desc: "جلد مريح مع شريط ستراس", img: "https://lh3.googleusercontent.com/d/165h60hm2a5qDN2yFbSAIiU3WoKv5E6nJ", sizes: [37, 38, 39, 40, 41], colors: ["هافان"] },
      { id: "RAHA-04", title: "جذمة", category: "أحذية وسليبرات", price: 185, onSale: false, desc: "حذاء فلات طبي مريح", img: "https://lh3.googleusercontent.com/d/1GyOqvo4mPVna7IaGY1Heaz1GLLQUYEGG", sizes: [37, 38, 39, 40, 41], colors: ["أسود"] },
      { id: "RAHA-05", title: "سليبر عالي منقرش", category: "أحذية وسليبرات", price: 165, onSale: false, desc: "شريط تريكو ونعل خفيف", img: "https://lh3.googleusercontent.com/d/1PRWzi8AYWz3RzbLLDNypkP7b2LRQ_awY", sizes: [37, 38, 39, 40, 41], colors: ["بني هافان"] },
      { id: "RAHA-06", title: "سليبر عالي نصين", category: "أحذية وسليبرات", price: 165, onSale: false, desc: "شريط ملون ناعم", img: "https://lh3.googleusercontent.com/d/1eKCfyUUXSz_k6seF3owWsmOX_YBpfwLW", sizes: [37, 38, 39, 40, 41], colors: ["متعدد"] },
      { id: "RAHA-07", title: "سليبر واطي شفاف", category: "أحذية وسليبرات", price: 145, onSale: false, desc: "دانتيل روز مفرغ راقي", img: "https://lh3.googleusercontent.com/d/1xX7rNoc3LL5u28zX63cyOq_ZERDdAwml", sizes: [37, 38, 39, 40, 41], colors: ["روز"] },
      { id: "RAHA-08", title: "سليبر واطي تايجر", category: "أحذية وسليبرات", price: 145, onSale: false, desc: "نقشة زيبرا عصرية", img: "https://lh3.googleusercontent.com/d/1THl7Uyou0BmM8eiK9ef0513TYmeLOwfz", sizes: [37, 38, 39, 40, 41], colors: ["اسود", "ابيض", "بني", "فضي", "بيج"] },
      { id: "RAHA-09", title: "عرض الـ 3 (سليبرات واطية)", category: "العروض", price: 360, onSale: true, desc: "عرض خاص: 3 سليبرات واطية من اختيارك والشحن مجاناً لجميع المحافظات!", img: "https://lh3.googleusercontent.com/d/11nzQ_9_FpRU0MJzXSkcZAGWeVEwlsfsc", sizes: [37, 38, 39, 40, 41], colors: [] }
    ];

    let productsData = [...baseProducts];
    let currentFilter = 'all';
    let activeItem = null;
    let selectedSize = null;
    let selectedColor = null;

    // Bundle selection states
    let b1 = { size: '37', color: 'اسود' };
    let b2 = { size: '37', color: 'اسود' };
    let b3 = { size: '37', color: 'اسود' };

    let cart = [];
    try {
      cart = JSON.parse(localStorage.getItem('raha_cart')) || [];
    } catch (e) {
      cart = [];
    }

    window.addEventListener('load', () => {
      renderCatalog();
      syncCartUI();

      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.style.visibility = 'hidden', 800);
        }
      }, 700);

      fetchProductsFromSheet();
    });

    async function fetchProductsFromSheet() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0 && data[0].title && data[0].title !== 'موديل RAHA') {
          productsData = data;
          renderCatalog();
        }
      } catch (err) {
        console.log("استمرار العمل بالبيانات المعروضة:", err);
      }
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-container');
      let filtered = [];

      if (currentFilter === 'all') {
        filtered = productsData;
      } else if (currentFilter === 'deals') {
        filtered = productsData.filter(p => p.onSale || p.category === 'العروض' || p.id === 'RAHA-09');
      } else {
        filtered = productsData.filter(p => p.category === currentFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: span 2; text-align:center; padding: 40px; color: var(--text-muted);">لا توجد منتجات في هذا القسم حالياً.</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="item-card" onclick="openProductSheet('${p.id}')">
          <div class="card-thumb">
            <img src="${p.img}" alt="${p.title}" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'300\\' height=\\'300\\' viewBox=\\'0 0 300 300\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23ECE6DD\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23A3845B\\' font-size=\\'22\\' font-weight=\\'bold\\' text-anchor=\\'middle\\' dominant-baseline=\\'middle\\'>RAHA</text></svg>';">
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="price-row">
              <span class="card-price">${p.price} ج.م</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function applyFilter(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog();
    }

    function openProductSheet(id) {
      activeItem = productsData.find(p => p.id === id);
      document.getElementById('p-title').innerText = activeItem.title;
      document.getElementById('p-image').src = activeItem.img;
      document.getElementById('p-desc').innerText = activeItem.desc;
      document.getElementById('p-price').innerText = `${activeItem.price} ج.م`;

      const isBundle = (activeItem.id === 'RAHA-09');
      document.getElementById('single-controls').style.display = isBundle ? 'none' : 'block';
      document.getElementById('bundle-controls').style.display = isBundle ? 'block' : 'none';

      if (isBundle) {
        renderBundleControls();
      } else {
        selectedSize = activeItem.sizes && activeItem.sizes.length ? activeItem.sizes[0] : '37';
        selectedColor = activeItem.colors && activeItem.colors.length ? activeItem.colors[0] : 'اللون المعروض';

        document.getElementById('p-sizes').innerHTML = (activeItem.sizes || []).map((s, idx) => `
          <div class="size-box ${idx === 0 ? 'selected' : ''}" onclick="selectSingleSize(this, '${s}')">${s}</div>
        `).join('');

        document.getElementById('p-colors').innerHTML = (activeItem.colors || []).map((c, idx) => `
          <div class="color-chip ${idx === 0 ? 'selected' : ''}" onclick="selectSingleColor(this, '${c}')">${c}</div>
        `).join('');
      }

      document.getElementById('product-drawer').classList.add('active');
    }

    function renderBundleControls() {
      const sizes = ['37', '38', '39', '40', '41'];
      const c1 = ['اسود', 'بيج', 'هافان'];
      const c2 = ['اسود', 'ابيض', 'بني', 'فضي', 'بيج'];
      const c3 = ['اسود', 'اخضر', 'هافان', 'بيج', 'ازرق'];

      b1 = { size: '37', color: c1[0] };
      b2 = { size: '37', color: c2[0] };
      b3 = { size: '37', color: c3[0] };

      renderRowHtml('b1-sizes', sizes, b1.size, (val) => b1.size = val);
      renderRowHtml('b1-colors', c1, b1.color, (val) => b1.color = val);

      renderRowHtml('b2-sizes', sizes, b2.size, (val) => b2.size = val);
      renderRowHtml('b2-colors', c2, b2.color, (val) => b2.color = val);

      renderRowHtml('b3-sizes', sizes, b3.size, (val) => b3.size = val);
      renderRowHtml('b3-colors', c3, b3.color, (val) => b3.color = val);
    }

    function renderRowHtml(containerId, list, currentVal, onChange) {
      const el = document.getElementById(containerId);
      el.innerHTML = list.map(item => `
        <div class="size-box ${item === currentVal ? 'selected' : ''}" onclick="handleChipClick(this, '${containerId}', '${item}')">${item}</div>
      `).join('');
      el._onChange = onChange;
    }

    function handleChipClick(elem, containerId, val) {
      const parent = document.getElementById(containerId);
      parent.querySelectorAll('.size-box').forEach(x => x.classList.remove('selected'));
      elem.classList.add('selected');
      if (parent._onChange) parent._onChange(val);
    }

    function selectSingleSize(elem, val) {
      document.querySelectorAll('#p-sizes .size-box').forEach(el => el.classList.remove('selected'));
      elem.classList.add('selected');
      selectedSize = val;
    }

    function selectSingleColor(elem, val) {
      document.querySelectorAll('#p-colors .color-chip').forEach(el => el.classList.remove('selected'));
      elem.classList.add('selected');
      selectedColor = val;
    }

    function addToCartConfirm() {
      if (activeItem.id === 'RAHA-09') {
        const specs = `[منقرش: مقاس ${b1.size} - لون ${b1.color}] + [تايجر: مقاس ${b2.size} - لون ${b2.color}] + [مجدول: مقاس ${b3.size} - لون ${b3.color}]`;
        const itemKey = `RAHA-09-${Date.now()}`;
        cart.push({
          key: itemKey,
          id: 'RAHA-09',
          title: 'عرض الـ 3 (سليبرات واطية)',
          price: 360,
          size: '3 قطع',
          color: specs,
          qty: 1
        });
      } else {
        const itemKey = `${activeItem.id}-${selectedSize}-${selectedColor}`;
        const found = cart.find(i => i.key === itemKey);
        if (found) {
          found.qty += 1;
        } else {
          cart.push({
            key: itemKey,
            id: activeItem.id,
            title: activeItem.title,
            price: activeItem.price,
            size: selectedSize,
            color: selectedColor,
            qty: 1
          });
        }
      }

      saveCartState();
      closeDrawer('product-drawer');
      openCart();
    }

    function saveCartState() {
      try {
        localStorage.setItem('raha_cart', JSON.stringify(cart));
      } catch (e) {}
      syncCartUI();
    }

    function syncCartUI() {
      const count = cart.reduce((total, i) => total + i.qty, 0);
      document.getElementById('cart-count').innerText = count;

      const listContainer = document.getElementById('cart-list');
      if (cart.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding:20px;">السلة فارغة</p>';
        document.getElementById('cart-total-val').innerText = '0 ج.م';
        return;
      }

      let total = 0;
      listContainer.innerHTML = cart.map((item, index) => {
        total += item.price * item.qty;
        return `
          <div class="cart-line">
            <div style="max-width: 85%;">
              <div style="font-weight:600; font-size:0.9rem;">${item.title}</div>
              <div style="font-size:0.75rem; color:var(--text-muted); line-height: 1.4;">${item.color}</div>
              <div style="font-size:0.85rem; font-weight:700; margin-top: 3px;">${item.price} ج.م × ${item.qty}</div>
            </div>
            <button onclick="deleteItem(${index})" style="background:none; border:none; color:#c0392b; font-size:1.1rem; cursor:pointer;">✕</button>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total-val').innerText = `${total} ج.م`;
    }

    function deleteItem(idx) {
      cart.splice(idx, 1);
      saveCartState();
    }

    function openCart() {
      syncCartUI();
      document.getElementById('cart-drawer').classList.add('active');
    }

    function closeDrawer(id) {
      document.getElementById(id).classList.remove('active');
    }

    async function handleOrderSubmit(e) {
      e.preventDefault();
      if (cart.length === 0) return alert('السلة فارغة!');

      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = 'جاري تسجيل طلبك...';
      submitBtn.disabled = true;

      const itemsSummary = cart.map(i => `${i.title} (${i.qty})`).join('، ');
      const specsSummary = cart.map(i => `${i.title}: ${i.color}`).join(' | ');

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            phone: phone,
            address: address,
            itemsSummary: itemsSummary,
            specsSummary: specsSummary,
            total: total
          })
        });
      } catch (err) {
        console.log("خطأ تسجيل الطلب:", err);
      }

      let msg = `طلب جديد من متجر RAHA:\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}\n\nتفاصيل المنتجات:\n`;
      cart.forEach(i => {
        msg += `- ${i.title} × ${i.qty}\n  ${i.color}\n`;
      });
      msg += `\nالإجمالي: ${total} ج.م (الشحن مجاناً للعروض)`;

      const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
      window.open(waUrl, '_blank');

      cart = [];
      saveCartState();
      submitBtn.innerText = 'إتمام الطلب عبر واتساب';
      submitBtn.disabled = false;
      closeDrawer('cart-drawer');
    }
  </script>
</body>
</html>
