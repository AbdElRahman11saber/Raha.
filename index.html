<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>RAHA | A Mark of Distinction</title>
  <!-- مكتبة قراءة ملفات الإكسل SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #1A1A1A;
      --text-muted: #7A756D;
      --gold: #C5A880;
      --gold-dark: #A3845B;
      --border: #EADBCC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .splash-logo {
      font-size: 2.4rem;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--text-main);
      animation: splashAppear 1.2s forwards ease-out;
    }

    .splash-star {
      color: var(--gold);
      font-size: 1rem;
      margin: 6px 0;
    }

    .splash-sub {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--gold-dark);
      text-transform: uppercase;
    }

    @keyframes splashAppear {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: rgba(250, 248, 245, 0.95);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text-main);
    }

    .brand-tagline {
      font-size: 0.55rem;
      letter-spacing: 1.5px;
      color: var(--gold-dark);
      text-transform: uppercase;
    }

    .cart-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filters-wrapper {
      padding: 14px 16px 8px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters-wrapper::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .container {
      padding: 12px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card-thumb {
      width: 100%;
      height: 160px;
      background: #ECE6DD;
      position: relative;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: auto;
    }

    .card-price {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 26, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: flex-end;
    }

    .drawer-overlay.active { display: flex; }

    .drawer-sheet {
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .close-icon {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .img-zoom-tip {
      font-size: 0.72rem;
      color: var(--gold-dark);
      text-align: center;
      margin-top: 4px;
      margin-bottom: 10px;
    }

    .options-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 10px 0 6px;
      font-weight: 600;
    }

    .options-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip-btn {
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg);
      color: var(--text-main);
      user-select: none;
    }

    .chip-btn.selected {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
    }

    .bundle-box {
      background: #FDFBF7;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .bundle-box-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--gold-dark);
      border-bottom: 1px dashed var(--border);
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .primary-btn {
      width: 100%;
      background: var(--text-main);
      color: var(--bg);
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 16px;
      cursor: pointer;
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .text-input {
      width: 100%;
      padding: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 8px;
      outline: none;
    }

    #image-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    #image-lightbox.active { display: flex; }

    #image-lightbox img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #FFFFFF;
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-logo">RAHA</div>
    <div class="splash-star">✦</div>
    <div class="splash-sub">A Mark of Distinction</div>
  </div>

  <header>
    <div>
      <div class="brand-title">RAHA</div>
      <div class="brand-tagline">A Mark of Distinction</div>
    </div>
    <button class="cart-btn" onclick="openCart()">
      السلة (<span id="cart-count">0</span>)
    </button>
  </header>

  <div class="filters-wrapper">
    <button class="filter-btn active" onclick="applyFilter('all', this)">جميع المنتجات</button>
    <button class="filter-btn" onclick="applyFilter('deals', this)">العروض</button>
    <button class="filter-btn" onclick="applyFilter('أحذية وسليبرات', this)">أحذية وسليبرات</button>
  </div>

  <main class="container">
    <div class="catalog-grid" id="catalog-container"></div>
  </main>

  <div id="image-lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="" alt="تكبير الصورة">
  </div>

  <div class="drawer-overlay" id="product-drawer">
    <div class="drawer-sheet">
      <div class="sheet-header">
        <h3 id="p-title"></h3>
        <button class="close-icon" onclick="closeDrawer('product-drawer')">&times;</button>
      </div>

      <img id="p-image" src="" style="width: 100%; height: 210px; object-fit: cover; border-radius: 8px; cursor: pointer;" onclick="openLightbox(this.src)">
      <div class="img-zoom-tip">🔍 اضغط على الصورة لتكبيرها</div>

      <p id="p-desc" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; line-height: 1.4;"></p>
      
      <div class="price-row" style="margin-bottom: 12px;">
        <span id="p-price" style="font-size: 1.25rem; font-weight: 800;"></span>
      </div>

      <div id="single-controls">
        <div class="options-title">المقاس:</div>
        <div class="options-row" id="p-sizes"></div>
        <div class="options-title">اللون:</div>
        <div class="options-row" id="p-colors"></div>
      </div>

      <div id="bundle-controls" style="display: none;">
        <div class="bundle-box" id="box-1">
          <div class="bundle-box-title" id="b1-title">القطعة الأولى</div>
          <div class="options-title">المقاس:</div>
          <div class="options-row" id="b1-sizes"></div>
          <div class="options-title">اللون:</div>
          <div class="options-row" id="b1-colors"></div>
        </div>

        <div class="bundle-box" id="box-2">
          <div class="bundle-box-title" id="b2-title">القطعة الثانية</div>
          <div class="options-title">المقاس:</div>
          <div class="options-row" id="b2-sizes"></div>
          <div class="options-title">اللون:</div>
          <div class="options-row" id="b2-colors"></div>
        </div>

        <div class="bundle-box" id="box-3">
          <div class="bundle-box-title" id="b3-title">القطعة الثالثة</div>
          <div class="options-title">المقاس:</div>
          <div class="options-row" id="b3-sizes"></div>
          <div class="options-title">اللون:</div>
          <div class="options-row" id="b3-colors"></div>
        </div>
      </div>

      <button class="primary-btn" onclick="addToCartConfirm()">إضافة إلى السلة</button>
    </div>
  </div>

  <div class="drawer-overlay" id="cart-drawer">
    <div class="drawer-sheet">
      <div class="sheet-header">
        <h3>سلة الطلبات</h3>
        <button class="close-icon" onclick="closeDrawer('cart-drawer')">&times;</button>
      </div>
      <div id="cart-list"></div>
      <div style="display:flex; justify-content:space-between; margin-top:14px; font-weight:700;">
        <span>الإجمالي:</span>
        <span id="cart-total-val">0 ج.م</span>
      </div>

      <form onsubmit="handleOrderSubmit(event)" style="margin-top: 18px;">
        <input type="text" id="cust-name" class="text-input" placeholder="الاسم بالكامل" required>
        <input type="tel" id="cust-phone" class="text-input" placeholder="رقم الهاتف (واتساب)" required>
        <textarea id="cust-address" class="text-input" rows="2" placeholder="العنوان بالتفصيل والمحافظة" required></textarea>
        <button type="submit" id="submit-btn" class="primary-btn" style="background: var(--gold-dark);">إتمام الطلب عبر واتساب</button>
      </form>
    </div>
  </div>

  <script>
    // رابط ملف الإكسل المرفوع على جيت هاب
    const EXCEL_FILE_URL = "متجر_RAHA_الاحترافي-v2.xlsx";
    const waNumber = "201203541255";

    let productsData = [];
    let currentFilter = 'all';
    let activeItem = null;
    let selectedSize = null;
    let selectedColor = null;

    let b1 = { name: '', size: '37', color: '' };
    let b2 = { name: '', size: '37', color: '' };
    let b3 = { name: '', size: '37', color: '' };

    let cart = [];
    try {
      cart = JSON.parse(localStorage.getItem('raha_cart')) || [];
    } catch (e) {
      cart = [];
    }

    window.addEventListener('load', () => {
      syncCartUI();
      fetchProductsFromExcel();
    });

    async function fetchProductsFromExcel() {
      try {
        const response = await fetch(EXCEL_FILE_URL);
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const rawData = XLSX.utils.sheet_to_json(worksheet);
        
        productsData = rawData.map(row => ({
          id: String(row['معرف المنتج'] || ''),
          title: String(row['اسم المنتج'] || ''),
          price: Number(row['السعر'] || 0),
          category: String(row['القسم'] || ''),
          img: String(row['رابط الصورة'] || ''),
          desc: String(row['الوصف'] || ''),
          colorsRaw: String(row['الألوان المتاحة'] || ''),
          onSale: row['عروض'] === 'نعم' || row['عروض'] === true
        }));

        if (productsData.length > 0) {
          renderCatalog();
        }
      } catch (err) {
        console.log("خطأ في قراءة ملف الإكسل:", err);
      } finally {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.style.visibility = 'hidden', 800);
        }
      }
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-container');
      let filtered = [];

      if (currentFilter === 'all') {
        filtered = productsData;
      } else if (currentFilter === 'deals') {
        filtered = productsData.filter(p => p.onSale || p.category === 'العروض' || String(p.id).includes('09') || String(p.id).includes('10') || (p.title && p.title.includes('عرض')));
      } else {
        filtered = productsData.filter(p => p.category === currentFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: span 2; text-align:center; padding: 40px; color: var(--text-muted);">لا توجد منتجات في هذا القسم حالياً.</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="item-card" onclick="openProductSheet('${p.id}')">
          <div class="card-thumb">
            <img src="${p.img}" alt="${p.title}" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'300\\' height=\\'300\\' viewBox=\\'0 0 300 300\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23ECE6DD\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23A3845B\\' font-size=\\'22\\' font-weight=\\'bold\\' text-anchor=\\'middle\\' dominant-baseline=\\'middle\\'>RAHA</text></svg>';">
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="price-row">
              <span class="card-price">${p.price} ج.م</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function applyFilter(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog();
    }

    function openProductSheet(id) {
      activeItem = productsData.find(p => String(p.id).trim() === String(id).trim());
      if (!activeItem) return;

      document.getElementById('p-title').innerText = activeItem.title;
      document.getElementById('p-image').src = activeItem.img;
      document.getElementById('p-desc').innerText = activeItem.desc;
      document.getElementById('p-price').innerText = `${activeItem.price} ج.م`;

      const isBundle = String(activeItem.id).includes('09') || String(activeItem.id).includes('10') || (activeItem.title && activeItem.title.includes('عرض'));

      document.getElementById('single-controls').style.display = isBundle ? 'none' : 'block';
      document.getElementById('bundle-controls').style.display = isBundle ? 'block' : 'none';

      if (isBundle) {
        renderBundleControlsFromSheet();
      } else {
        const sizesArr = [37, 38, 39, 40, 41];
        let colorsArr = ['متوفرة'];
        if (activeItem.colorsRaw) {
          colorsArr = activeItem.colorsRaw.split(/[,،]/).map(c => c.trim()).filter(Boolean);
        }
        if (colorsArr.length === 0) colorsArr = ['متوفرة'];

        selectedSize = sizesArr[0];
        selectedColor = colorsArr[0];

        document.getElementById('p-sizes').innerHTML = sizesArr.map((s, idx) => `
          <div class="chip-btn ${idx === 0 ? 'selected' : ''}" onclick="selectSingleOption('p-sizes', this, '${s}', 'size')">${s}</div>
        `).join('');

        document.getElementById('p-colors').innerHTML = colorsArr.map((c, idx) => `
          <div class="chip-btn ${idx === 0 ? 'selected' : ''}" onclick="selectSingleOption('p-colors', this, '${c}', 'color')">${c}</div>
        `).join('');
      }

      document.getElementById('product-drawer').classList.add('active');
    }

    function selectSingleOption(containerId, elem, val, type) {
      document.querySelectorAll(`#${containerId} .chip-btn`).forEach(el => el.classList.remove('selected'));
      elem.classList.add('selected');
      if (type === 'size') selectedSize = val;
      if (type === 'color') selectedColor = val;
    }

    function renderBundleControlsFromSheet() {
      const sizes = ['37', '38', '39', '40', '41'];
      let colors1 = ['اسود', 'بيج', 'هافان'];
      let colors2 = ['اسود', 'ابيض', 'بني', 'فضي', 'بيج'];
      let colors3 = ['اسود', 'بيج', 'هافان', 'كشمير'];

      const isDeal420 = (activeItem.price == 420) || (activeItem.title && activeItem.title.includes('420')) || (activeItem.desc && activeItem.desc.includes('جذمة'));

      document.getElementById('box-1').style.display = 'block';
      document.getElementById('box-2').style.display = 'block';
      document.getElementById('box-3').style.display = 'block';

      if (isDeal420) {
        document.getElementById('b1-title').innerText = '1. سليبر فوم عالي منقرش';
        document.getElementById('b2-title').innerText = '2. جذمة كلاسيك طبية';
        document.getElementById('b3-title').innerText = '3. سليبر واطي تايجر';
        
        colors1 = ['بني هافان'];
        colors2 = ['أسود'];
        colors3 = ['اسود', 'ابيض', 'بني', 'فضي', 'بيج'];
      } else {
        document.getElementById('b1-title').innerText = '1. السليبر المنقرش';
        document.getElementById('b2-title').innerText = '2. السليبر التايجر';
        document.getElementById('b3-title').innerText = '3. السليبر الشفاف';

        if (activeItem && activeItem.colorsRaw) {
          const parts = String(activeItem.colorsRaw).split('-');
          if (parts.length >= 3) {
            const parseList = (str) => str.replace(/[()]/g, '').split(/[,،]/).map(s => s.trim()).filter(Boolean);
            colors1 = parseList(parts[0]) || colors1;
            colors2 = parseList(parts[1]) || colors2;
            colors3 = parseList(parts[2]) || colors3;
          }
        }
      }

      b1 = { name: document.getElementById('b1-title').innerText, size: '37', color: colors1[0] };
      b2 = { name: document.getElementById('b2-title').innerText, size: '37', color: colors2[0] };
      b3 = { name: document.getElementById('b3-title').innerText, size: '37', color: colors3[0] };

      renderChipGroup('b1-sizes', sizes, b1.size, val => b1.size = val);
      renderChipGroup('b1-colors', colors1, b1.color, val => b1.color = val);

      renderChipGroup('b2-sizes', sizes, b2.size, val => b2.size = val);
      renderChipGroup('b2-colors', colors2, b2.color, val => b2.color = val);

      renderChipGroup('b3-sizes', sizes, b3.size, val => b3.size = val);
      renderChipGroup('b3-colors', colors3, b3.color, val => b3.color = val);
    }

    function renderChipGroup(containerId, list, defaultVal, onSelect) {
      const container = document.getElementById(containerId);
      container.innerHTML = list.map(item => `
        <div class="chip-btn ${item === defaultVal ? 'selected' : ''}" onclick="updateChipGroup(this, '${containerId}', '${item}')">${item}</div>
      `).join('');
      container._onSelect = onSelect;
    }

    function updateChipGroup(elem, containerId, val) {
      const parent = document.getElementById(containerId);
      parent.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('selected'));
      elem.classList.add('selected');
      if (parent._onSelect) parent._onSelect(val);
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('image-lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('image-lightbox').classList.remove('active');
    }

    function addToCartConfirm() {
      const isBundle = String(activeItem.id).includes('09') || String(activeItem.id).includes('10') || (activeItem.title && activeItem.title.includes('عرض'));

      if (isBundle) {
        const specs = `[${b1.name}: مقاس ${b1.size} - لون ${b1.color}] + [${b2.name}: مقاس ${b2.size} - لون ${b2.color}] + [${b3.name}: مقاس ${b3.size} - لون ${b3.color}]`;
        const itemKey = `BUNDLE-${Date.now()}`;
        cart.push({
          key: itemKey,
          id: activeItem.id,
          title: activeItem.title,
          price: activeItem.price,
          size: '3 قطع',
          color: specs,
          qty: 1
        });
      } else {
        const itemKey = `${activeItem.id}-${selectedSize}-${selectedColor}`;
        const found = cart.find(i => i.key === itemKey);
        if (found) {
          found.qty += 1;
        } else {
          cart.push({
            key: itemKey,
            id: activeItem.id,
            title: activeItem.title,
            price: activeItem.price,
            size: selectedSize,
            color: selectedColor,
            qty: 1
          });
        }
      }

      saveCartState();
      closeDrawer('product-drawer');
      openCart();
    }

    function saveCartState() {
      try {
        localStorage.setItem('raha_cart', JSON.stringify(cart));
      } catch (e) {}
      syncCartUI();
    }

    function syncCartUI() {
      const count = cart.reduce((total, i) => total + i.qty, 0);
      document.getElementById('cart-count').innerText = count;

      const listContainer = document.getElementById('cart-list');
      if (cart.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding:20px;">السلة فارغة</p>';
        document.getElementById('cart-total-val').innerText = '0 ج.م';
        return;
      }

      let total = 0;
      listContainer.innerHTML = cart.map((item, index) => {
        total += item.price * item.qty;
        return `
          <div class="cart-line">
            <div style="max-width: 85%;">
              <div style="font-weight:700; font-size:0.9rem;">${item.title}</div>
              <div style="font-size:0.75rem; color:var(--text-muted); line-height: 1.4; margin-top:2px;">${item.color}</div>
              <div style="font-size:0.85rem; font-weight:700; margin-top: 3px;">${item.price} ج.م × ${item.qty}</div>
            </div>
            <button onclick="deleteItem(${index})" style="background:none; border:none; color:#c0392b; font-size:1.1rem; cursor:pointer;">✕</button>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total-val').innerText = `${total} ج.م`;
    }

    function deleteItem(idx) {
      cart.splice(idx, 1);
      saveCartState();
    }

    function openCart() {
      syncCartUI();
      document.getElementById('cart-drawer').classList.add('active');
    }

    function closeDrawer(id) {
      document.getElementById(id).classList.remove('active');
    }

    function handleOrderSubmit(e) {
      e.preventDefault();
      if (cart.length === 0) return alert('السلة فارغة!');

      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

      let msg = `طلب جديد من متجر RAHA:\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}\n\nتفاصيل المنتجات:\n`;
      cart.forEach(i => {
        msg += `- ${i.title} × ${i.qty}\n  ${i.color}\n`;
      });
      msg += `\nالإجمالي: ${total} ج.م (شامل مصاريف الشحن)`;

      const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
      window.open(waUrl, '_blank');

      cart = [];
      saveCartState();
      closeDrawer('cart-drawer');
    }
  </script>
</body>
</html>
